# 卅语言 · 自动发版：构建完成后上传 GitHub Releases。
# 两种触发方式：
#   1) 推送 v* 标签（git tag v0.2.2 && git push origin v0.2.2）→ 自动构建并发布该版本；
#   2) Actions 页手动运行（workflow_dispatch），填版本号 → 工作流自动创建标签再发布。
# 发布物：sahou.exe —— 单文件自带全部 stones 标准库包与 wasm 浏览器运行时；
#         以及与标签版本匹配的 VS Code 扩展 vsix（存在时一并发布）。
# Release 说明取自根目录 CHANGELOG.md 里与标签同名的小节（## v0.2.1 这样的二级标题）；
# 找不到对应小节时退回 GitHub 自动生成的提交列表。
# 全量测试由 ci.yml 在 main 上把关；本工作流做发布前冒烟验证。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v0.2.1）"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

jobs:
  release:
    name: 构建 + 上传 Releases
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: 计算版本号与标签
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 手动触发时创建并推送标签
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "标签 $TAG 已存在，跳过创建"
          else
            git tag -a "$TAG" -m "卅 $TAG"
            git push origin "$TAG"
          fi

      # 手动触发时以标签对应提交为准构建（发布物与标签严格对应）
      - name: 切到标签对应提交
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: 生成 wasm 运行时（stonesfs.go 内嵌需要）
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o sahou.wasm ./cmd/sahouwasm

      - name: 构建 sahou.exe
        run: go build -trimpath -ldflags "-s -w" -o sahou.exe .

      - name: 发布前冒烟验证
        shell: bash
        run: |
          ./sahou.exe run examples/入门演示.saho > /dev/null
          ./sahou.exe stones | grep -q 时长库
          ./sahou.exe stones | grep -q 罗马数字
          echo "冒烟通过：exe 可运行且自带十八包"

      - name: 整理发布物
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          mkdir -p release
          cp sahou.exe release/
          # 与标签版本匹配的扩展（v0.2.1 → sahou-language-0.2.1.vsix）
          if [ -f "editors/vscode/sahou-language-${TAG#v}.vsix" ]; then
            cp "editors/vscode/sahou-language-${TAG#v}.vsix" release/
          else
            echo "提示：没有找到 editors/vscode/sahou-language-${TAG#v}.vsix，本次不发扩展附件"
          fi

      - name: 上传到 GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # 说明：取根目录 CHANGELOG.md 里以 "## <标签>" 开头的小节（到下一个 ## 为止，
          # 即只截取当前版本的更新说明）；没有对应小节就用 GitHub 自动生成的提交列表
          awk -v tag="$TAG" '
            $0 ~ "^## " tag { flag = 1; next }
            /^## / { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release_notes.md || true
          if [ -s release_notes.md ]; then
            ARGS=(--notes-file release_notes.md)
          else
            ARGS=(--generate-notes)
          fi
          # 先清掉同名旧 Release（删标签会把已发布 Release 变成草稿残留），再全新创建
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == true) | [.id, (.name // "")] | @tsv' \
            | while IFS="$(printf '\t')" read -r id name; do
                case "$name" in
                  *"$TAG"*) gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" >/dev/null 2>&1 || true ;;
                esac
              done
          gh release create "$TAG" release/sahou.exe --title "卅 $TAG" "${ARGS[@]}"
          echo "已发布 $TAG（仅 sahou.exe）"
